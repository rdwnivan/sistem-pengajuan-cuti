name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: read-all

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cuti-app
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cuti-app/package-lock.json
      - name: Install
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      # Sidik jari build (nama + sha256 chunk runtime webpack). Dipakai
      # `post-deploy-smoke.yml` untuk menjawab "deploy commit ini sudah
      # mendarat?" tanpa menebak dari dashboard Vercel. Cara kerja: nama chunk
      # webpack di-hash dari isi modul, jadi build yang sama menghasilkan nama
      # yang sama di mesin mana pun.
      - name: Fingerprint build (untuk post-deploy smoke)
        run: |
          node -e '
            const { createHash } = require("node:crypto");
            const { readFileSync, writeFileSync, readdirSync } = require("node:fs");
            const name = readdirSync(".next/static/chunks").find((f) => /^webpack-.*\.js$/.test(f));
            const sha = createHash("sha256").update(readFileSync(`.next/static/chunks/${name}`)).digest("hex");
            writeFileSync("chunk-name.txt", name + "\n");
            writeFileSync("chunk-sha256.txt", sha + "\n");
            console.log(`[fingerprint] ${name} sha256=${sha}`);
          '
      - name: Upload fingerprint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chunk-fingerprint
          path: |
            cuti-app/chunk-name.txt
            cuti-app/chunk-sha256.txt
          if-no-files-found: error
          retention-days: 90

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cuti-app
    needs: verify
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cuti_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/cuti_test
      CRON_SECRET: ci-test-cron-secret-at-least-32-chars!!
      FONNTE_TOKEN: ""
      BLOB_READ_WRITE_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cuti-app/package-lock.json
      - name: Install
        run: npm ci
      - name: Prisma generate + push + seed
        run: npx prisma generate && npx prisma db push && SEED_FORCE=true npm run db:seed
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps
      - name: Run E2E tests
        run: npx playwright test
        timeout-minutes: 15
      - name: Run flow tests (stateful, serial, worker 1)
        run: npx playwright test --config=playwright.flows.config.ts
        timeout-minutes: 15
      - name: Run rate-limit tests (serial, worker 1)
        run: npx playwright test --config=playwright.rate-limit.config.ts
        timeout-minutes: 10
