name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cuti-app
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cuti-app/package-lock.json
      - name: Install
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Dependency compatibility
        run: npm run test:dependencies && npm run test:sdk && npm run test:tooling
      - name: Unit tests
        run: npm run test:unit
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      # Identitas build untuk `post-deploy-smoke.yml`: SHA commit (+ nama/hash
      # chunk sebagai diagnostik). Yang DIPERCAYA smoke adalah SHA commit,
      # dibandingkan dengan yang dilaporkan `GET /api/version` deployment yang
      # melayani alias production.
      #
      # JANGAN kembalikan perbandingan hash chunk lintas lingkungan: build commit
      # yang sama bisa menghasilkan isi chunk runtime berbeda (terukur: nama
      # `webpack-2eb758d…` yang sama, 3482 byte di satu lingkungan vs 3864 byte di
      # lingkungan lain), sehingga smoke melaporkan MISMATCH palsu.
      - name: Identitas build (untuk post-deploy smoke)
        run: node scripts/fingerprint.mjs
      - name: Upload identitas build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-identity
          path: |
            cuti-app/chunk-name.txt
            cuti-app/chunk-sha256.txt
            cuti-app/commit-sha.txt
          if-no-files-found: error
          retention-days: 90

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cuti-app
    needs: verify
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cuti_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/cuti_test
      CRON_SECRET: ci-test-cron-secret-at-least-32-chars!!
      FONNTE_TOKEN: ""
      BLOB_READ_WRITE_TOKEN: ""
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cuti-app/package-lock.json
      - name: Install
        run: npm ci
      - name: Prisma generate + push + seed
        run: npx prisma generate && npx prisma db push && SEED_FORCE=true npm run db:seed
      - name: Ephemeral VAPID for isolated push security tests
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const keys = require('web-push').generateVAPIDKeys();
          console.log(`::add-mask::${keys.publicKey}`);
          console.log(`::add-mask::${keys.privateKey}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `VAPID_PUBLIC_KEY=${keys.publicKey}\nVAPID_PRIVATE_KEY=${keys.privateKey}\n`);
          NODE
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps
      - name: Run E2E tests
        run: npx playwright test
        timeout-minutes: 15
      - name: Run flow tests (stateful, serial, worker 1)
        run: npx playwright test --config=playwright.flows.config.ts
        timeout-minutes: 15
      - name: Run rate-limit tests (serial, worker 1)
        run: npx playwright test --config=playwright.rate-limit.config.ts
        timeout-minutes: 10
