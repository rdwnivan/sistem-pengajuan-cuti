name: Post-deploy smoke

# Menjawab "deploy commit X sudah benar-benar mendarat di production?" dengan
# membandingkan SHA commit yang DILAPORKAN deployment yang melayani
# (`GET /api/version`) terhadap commit yang dimaksud.
#
# Kenapa BUKAN hash chunk (percobaan pertama yang gagal):
# build dari commit yang sama bisa menghasilkan isi chunk runtime webpack yang
# berbeda antar lingkungan — terukur nama `webpack-2eb758d…` yang sama persis
# tetapi 3482 byte di satu lingkungan dan 3864 byte di lingkungan lain. Jadi
# perbandingan hash lintas lingkungan melaporkan MISMATCH palsu. Nama/hash chunk
# sekarang hanya informasional.
#
# Trigger sengaja hanya dua:
#   1. `workflow_dispatch` — manual, untuk menyelidiki commit tertentu.
#   2. `workflow_run` setelah workflow CI sukses di `main` — push ke `main`
#      memang momen deploy production. Job dibatasi `head_branch == main`, jadi
#      PR dari fork tidak pernah masuk.
# TIDAK ada `on: push`: smoke ini memukul production.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL yang diperiksa"
        required: false
        default: "https://cuti-app.vercel.app"
      expected_sha:
        description: "Commit SHA yang diharapkan (40 hex). Kosongkan = pakai commit workflow ini."
        required: false
        default: ""
      fail_on_mismatch:
        description: "Gagalkan run bila versi live tidak cocok / tidak bisa ditentukan"
        type: boolean
        required: false
        default: true
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# read-all cukup: smoke hanya membaca production + mengunduh artifact CI.
permissions: read-all

concurrency:
  group: post-deploy-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    env:
      # SEMUA nilai dari event/input masuk lewat `env`, tidak pernah
      # diinterpolasi ke dalam skrip shell (template injection). Input
      # `base_url`/`expected_sha` bisa diketik manusia, jadi ini wajib.
      BASE_URL: ${{ github.event.inputs.base_url || 'https://cuti-app.vercel.app' }}
      FAIL_ON_MISMATCH: ${{ github.event.inputs.fail_on_mismatch || 'true' }}
      INPUT_EXPECTED_SHA: ${{ github.event.inputs.expected_sha || '' }}
      EVENT_NAME: ${{ github.event_name }}
      REPO: ${{ github.repository }}
      # workflow_run: commit yang barusan di-CI/deploy. dispatch: commit branch ini.
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      # Smoke tidak butuh menulis ke repo; jangan biarkan token ikut tersimpan
      # di checkout.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bandingkan versi live + probe read-only
        id: smoke
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          FAIL=0
          STATUS=""
          SHA_RE='^[0-9a-f]{40}$'

          if printf '%s' "$INPUT_EXPECTED_SHA" | grep -qE "$SHA_RE"; then
            EXPECTED_SHA=$(printf '%s' "$INPUT_EXPECTED_SHA" | tr 'A-F' 'a-f')
          else
            EXPECTED_SHA=$(printf '%s' "$TARGET_SHA" | tr 'A-F' 'a-f')
          fi
          echo "commit yang diharapkan: ${EXPECTED_SHA}"

          # --- Identitas build commit ini (artifact CI) — hanya diagnostik ---
          BUILD_CHUNK=""
          RUN_ID=""
          for i in 1 2 3 4 5 6; do
            RUN_ID=$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${EXPECTED_SHA}&status=completed&per_page=10" \
              --jq '[.workflow_runs[]? | select(.conclusion=="success") | .id] | first // empty' 2>/dev/null) || RUN_ID=""
            # Wajib numerik: `gh api` bisa mengembalikan payload error yang bukan id.
            case "${RUN_ID}" in
              ''|*[!0-9]*) RUN_ID="" ;;
            esac
            [ -n "${RUN_ID}" ] && break
            echo "run CI untuk ${EXPECTED_SHA} belum terlihat, ulang 15s (percobaan ${i}/6)"
            sleep 15
          done
          if [ -n "${RUN_ID}" ]; then
            ART_ID=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/artifacts" \
              --jq '[.artifacts[]? | select(.name=="build-identity" or .name=="chunk-fingerprint") | .id] | first // empty' 2>/dev/null) || ART_ID=""
            case "${ART_ID}" in
              ''|*[!0-9]*) ART_ID="" ;;
            esac
            if [ -n "${ART_ID}" ]; then
              gh api "repos/${REPO}/actions/artifacts/${ART_ID}/zip" > artifact.zip 2>/dev/null
              if unzip -o -q artifact.zip -d expected/ 2>/dev/null && [ -f expected/chunk-name.txt ]; then
                BUILD_CHUNK=$(tr -d '[:space:]' < expected/chunk-name.txt)
                # Artifact dari workflow lain — validasi bentuknya sebelum dipakai.
                printf '%s' "${BUILD_CHUNK}" | grep -qE '^webpack-[0-9a-f.-]+\.js$' || BUILD_CHUNK=""
              fi
            fi
          fi
          if [ -n "${BUILD_CHUNK}" ]; then
            echo "chunk build commit itu (diagnostik): ${BUILD_CHUNK}"
          else
            echo "chunk build commit itu: tidak tersedia (diagnostik dilewati)"
          fi

          # --- Versi yang SEDANG dilayani alias -----------------------------
          VCODE=$(curl -sS -o version.json -w '%{http_code}' "${BASE_URL}/api/version")
          LIVE_SHA=""
          if [ "${VCODE}" = "200" ]; then
            LIVE_SHA=$(node -e '
              const fs = require("node:fs");
              try {
                const j = JSON.parse(fs.readFileSync("version.json", "utf8"));
                const s = typeof j.sha === "string" ? j.sha.toLowerCase() : "";
                console.log(/^[0-9a-f]{40}$/.test(s) ? s : "");
              } catch { console.log(""); }
            ')
          fi
          echo "GET /api/version -> ${VCODE}; sha live: ${LIVE_SHA:-<tidak ada>}"

          # --- Fail-fast: HTML produksi tidak boleh menunjuk aset yang 404 ---
          # Menangkap gejala "HTML dari build A, aset dari build B".
          LOGIN=$(curl -sS -o login.html -w '%{http_code}' "${BASE_URL}/login")
          LIVE_CHUNK=""
          if [ "${LOGIN}" = "200" ]; then
            LIVE_CHUNK=$(grep -oE 'chunks/webpack-[0-9a-f.-]+\.js' login.html | head -n1 | sed 's|chunks/||')
            if [ -z "${LIVE_CHUNK}" ]; then
              echo "::error::Tidak ada referensi chunk webpack di HTML /login."
              FAIL=1
            else
              CODE=$(curl -sS -o /dev/null -w '%{http_code}' "${BASE_URL}/_next/static/chunks/${LIVE_CHUNK}")
              if [ "${CODE}" = "200" ]; then
                echo "OK   chunk ${LIVE_CHUNK} -> 200"
              else
                echo "::error::Chunk ${LIVE_CHUNK} direferensikan HTML /login tapi ${CODE} — HTML dan aset berasal dari build berbeda."
                FAIL=1
              fi
            fi
          else
            echo "::error::GET ${BASE_URL}/login -> ${LOGIN} (diharapkan 200)"
            FAIL=1
          fi

          # --- Probe read-only (tanpa login, tanpa tulis DB/Blob) -----------
          code_of() { curl -sS -o /dev/null -w '%{http_code}' "$1"; }
          expect_code() { # url yang-diharapkan label
            local got
            got=$(code_of "$1")
            if [ "${got}" = "$2" ]; then
              echo "OK   $3 -> ${got}"
            else
              echo "::error::$3 -> ${got} (diharapkan $2) di $1"
              FAIL=1
            fi
          }
          expect_login_redirect() { # path
            local out code loc
            out=$(curl -sS -o /dev/null -D - "${BASE_URL}$1")
            code=$(printf '%s' "${out}" | head -n1 | awk '{print $2}')
            loc=$(printf '%s' "${out}" | grep -i '^location:' | tr -d '\r' | awk '{print $2}')
            if [ "${code}" = "307" ] && printf '%s' "${loc}" | grep -q '/login'; then
              echo "OK   $1 -> 307 ${loc}"
            else
              echo "::error::$1 -> ${code:-?} ${loc:-?} (diharapkan 307 ke /login)"
              FAIL=1
            fi
          }
          # Jalur hardening cron (perbandingan constant-time) harus hidup:
          # secret salah dan tanpa secret sama-sama 401, bukan 200.
          expect_code "${BASE_URL}/api/cron?secret=salah" 401 "/api/cron (secret salah)"
          expect_code "${BASE_URL}/api/cron" 401 "/api/cron (tanpa secret)"
          for p in / /slip-gaji /hr /persetujuan /laporan /kalender /riwayat /notifikasi; do
            expect_login_redirect "$p"
          done

          # --- Putusan versi -------------------------------------------------
          if [ "${LIVE_SHA}" = "${EXPECTED_SHA}" ]; then
            STATUS="MATCH: alias production melayani commit ${EXPECTED_SHA}."
            echo "${STATUS}"
          elif [ -n "${LIVE_SHA}" ]; then
            STATUS="MISMATCH: alias melayani commit ${LIVE_SHA}, diharapkan ${EXPECTED_SHA}."
            echo "::error::${STATUS} Artinya deploy commit itu BELUM live (alias nyangkut di deployment lama / ada Instant Rollback). Periksa dashboard Vercel lalu Promote to Production."
            if [ "${EVENT_NAME}" = "workflow_run" ] || [ "${FAIL_ON_MISMATCH}" = "true" ]; then
              FAIL=1
            else
              echo "::warning::fail_on_mismatch=false → mismatch tidak menggagalkan run."
            fi
          elif [ "${VCODE}" = "404" ]; then
            # Endpoint belum ada di alias = alias masih build lama (sebelum PR
            # yang menambahkan /api/version). Tetap sinyal nyangkut.
            STATUS="TIDAK BISA DITENTUKAN: ${BASE_URL}/api/version -> 404, jadi alias masih build lama (endpoint belum ada)."
            echo "::warning::${STATUS}"
            if [ "${EVENT_NAME}" = "workflow_run" ] || [ "${FAIL_ON_MISMATCH}" = "true" ]; then
              FAIL=1
            fi
          else
            STATUS="TIDAK BISA DITENTUKAN: /api/version -> ${VCODE} tanpa sha 40-hex; versi alias tidak diketahui."
            echo "::warning::${STATUS}"
            if [ "${FAIL_ON_MISMATCH}" = "true" ]; then
              FAIL=1
            fi
          fi

          {
            echo "status=${STATUS}"
            echo "live_sha=${LIVE_SHA}"
            echo "expected_sha=${EXPECTED_SHA}"
            echo "live_chunk=${LIVE_CHUNK}"
            echo "build_chunk=${BUILD_CHUNK}"
            echo "verdict_fail=${FAIL}"
          } >> "$GITHUB_OUTPUT"
          # Tidak `exit 1` di sini supaya ringkasan selalu ditulis; statusnya
          # dibaca langkah berikutnya.
          exit 0

      - name: Ringkasan
        if: always()
        run: |
          {
            echo "## Post-deploy smoke — \`${BASE_URL}\`"
            echo ""
            echo "| Item | Nilai |"
            echo "|---|---|"
            echo "| commit diharapkan | \`${{ steps.smoke.outputs.expected_sha }}\` |"
            echo "| commit dilayani alias | \`${{ steps.smoke.outputs.live_sha }}\` |"
            echo "| chunk live | \`${{ steps.smoke.outputs.live_chunk }}\` |"
            echo "| chunk build commit itu (diagnostik) | \`${{ steps.smoke.outputs.build_chunk }}\` |"
            echo ""
            echo "**Hasil: ${{ steps.smoke.outputs.status }}**"
            echo ""
            echo "Probe read-only: \`/login\` 200 + chunk-nya 200, \`/api/cron\` (secret salah &"
            echo "tanpa secret) 401, dan 8 rute terproteksi 307 → \`/login\`."
            echo "Smoke ini **tidak** login dan **tidak** menulis apa pun ke DB/Blob production."
            echo ""
            echo "> Hash isi chunk **tidak** dibandingkan antar lingkungan: build commit yang sama"
            echo "> bisa punya isi chunk berbeda (terukur 3482 vs 3864 byte pada nama chunk yang sama),"
            echo "> jadi perbandingan itu menghasilkan MISMATCH palsu. Yang menentukan adalah SHA commit."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Gagalkan run bila ada yang tidak sesuai
        if: steps.smoke.outputs.verdict_fail != '0'
        run: |
          echo "::error::Post-deploy smoke menemukan ketidaksesuaian — lihat ringkasan di atas."
          exit 1
