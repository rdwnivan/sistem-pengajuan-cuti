name: Post-deploy smoke

# Menjawab "deploy commit X sudah benar-benar mendarat di production?" tanpa
# menebak dari dashboard Vercel: bandingkan sidik jari chunk build commit itu
# (artifact CI) dengan chunk yang benar-benar disajikan alias production.
#
# Trigger sengaja hanya dua:
#   1. `workflow_dispatch` — manual, untuk menyelidiki commit tertentu
#      (mis. branch ci/post-deploy-smoke).
#   2. `workflow_run` setelah workflow CI sukses di `main` — push ke `main`
#      memang momen deploy production. Job-nya dibatasi `head_branch == main`,
#      jadi PR dari fork TIDAK pernah masuk ke sini.
# TIDAK ada `on: push`: smoke ini memukul production.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL yang diperiksa"
        required: false
        default: "https://cuti-app.vercel.app"
      fail_on_mismatch:
        description: "Gagalkan run bila sidik jari chunk tidak cocok"
        type: boolean
        required: false
        default: true
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Smoke hanya membaca production + mengunduh artifact CI.
permissions: read-all

concurrency:
  group: post-deploy-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    env:
      # SEMUA nilai dari event/input masuk lewat `env`, tidak pernah
      # diinterpolasi ke dalam skrip shell (template injection). Input
      # `base_url` bisa diketik manusia, jadi ini wajib.
      BASE_URL: ${{ github.event.inputs.base_url || 'https://cuti-app.vercel.app' }}
      FAIL_ON_MISMATCH: ${{ github.event.inputs.fail_on_mismatch || 'true' }}
      EVENT_NAME: ${{ github.event_name }}
      REPO: ${{ github.repository }}
      # workflow_run: commit yang barusan di-CI/deploy. dispatch: commit branch ini.
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      # Smoke tidak butuh menulis ke repo; jangan biarkan token ikut tersimpan
      # di checkout.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bandingkan sidik jari + probe read-only
        id: smoke
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          FAIL=0
          STATUS=""

          # --- 1. Sidik jari yang SEHARUSNYA live (artifact CI commit ini) ---
          EXPECTED_AVAILABLE=false
          RUN_ID=""
          for i in 1 2 3 4 5 6; do
            RUN_ID=$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${TARGET_SHA}&status=completed&per_page=10" \
              --jq '[.workflow_runs[]? | select(.conclusion=="success") | .id] | first // empty' 2>/dev/null) || RUN_ID=""
            # Wajib numerik: `gh api` bisa mengembalikan payload error yang bukan id.
            case "${RUN_ID}" in
              ''|*[!0-9]*) RUN_ID="" ;;
            esac
            [ -n "${RUN_ID}" ] && break
            echo "run CI untuk ${TARGET_SHA} belum terlihat, ulang 15s (percobaan ${i}/6)"
            sleep 15
          done
          if [ -z "${RUN_ID}" ]; then
            echo "::warning::Tidak ada run CI sukses untuk ${TARGET_SHA} — perbandingan sidik jari dilewati."
          else
            ART_ID=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/artifacts" \
              --jq '[.artifacts[]? | select(.name=="chunk-fingerprint") | .id] | first // empty' 2>/dev/null) || ART_ID=""
            case "${ART_ID}" in
              ''|*[!0-9]*) ART_ID="" ;;
            esac
            if [ -z "${ART_ID}" ]; then
              echo "::warning::Artifact chunk-fingerprint tidak ada di run CI ${RUN_ID} (run sebelum PR ini merge?) — perbandingan dilewati."
            else
              gh api "repos/${REPO}/actions/artifacts/${ART_ID}/zip" > artifact.zip 2>/dev/null
              if unzip -o -q artifact.zip -d expected/ 2>/dev/null; then
                EXPECTED_NAME=$(tr -d '[:space:]' < expected/chunk-name.txt)
                EXPECTED_SHA=$(tr -d '[:space:]' < expected/chunk-sha256.txt)
                # Artifact datang dari workflow lain — validasi bentuknya sebelum
                # dipakai, jangan percaya isinya begitu saja.
                if printf '%s' "${EXPECTED_NAME}" | grep -qE '^webpack-[0-9a-f.-]+\.js$' \
                  && printf '%s' "${EXPECTED_SHA}" | grep -qE '^[0-9a-f]{64}$'; then
                  EXPECTED_AVAILABLE=true
                else
                  echo "::warning::Isi artifact chunk-fingerprint tidak berbentuk seperti yang diharapkan — diabaikan."
                  EXPECTED_NAME=""
                  EXPECTED_SHA=""
                fi
              fi
            fi
          fi
          {
            echo "expected_available=${EXPECTED_AVAILABLE}"
            echo "expected_name=${EXPECTED_NAME:-}"
            echo "expected_sha=${EXPECTED_SHA:-}"
          } >> "$GITHUB_OUTPUT"
          echo "expected: ${EXPECTED_NAME:-<tidak ada>} ${EXPECTED_SHA:-}"

          # --- 2. Sidik jari build yang SEDANG disajikan alias ---
          LOGIN=$(curl -sS -o login.html -w '%{http_code}' "${BASE_URL}/login")
          echo "GET /login -> ${LOGIN}"
          LIVE_NAME=""
          LIVE_SHA=""
          if [ "${LOGIN}" != "200" ]; then
            echo "::error::GET ${BASE_URL}/login -> ${LOGIN} (diharapkan 200)"
            FAIL=1
          else
            LIVE_NAME=$(grep -oE 'chunks/webpack-[0-9a-f.-]+\.js' login.html | head -n1 | sed 's|chunks/||')
            if [ -z "${LIVE_NAME}" ]; then
              echo "::error::Tidak ada referensi chunk webpack di HTML /login."
              FAIL=1
            else
              CODE=$(curl -sS -o live-chunk.js -w '%{http_code}' "${BASE_URL}/_next/static/chunks/${LIVE_NAME}")
              echo "GET /_next/static/chunks/${LIVE_NAME} -> ${CODE}"
              if [ "${CODE}" != "200" ]; then
                echo "::error::Chunk ${LIVE_NAME} direferensikan HTML /login tapi ${CODE} — alias menyajikan HTML dari satu build dan aset dari build lain (gejala alias nyangkut)."
                FAIL=1
              else
                LIVE_SHA=$(sha256sum live-chunk.js | cut -d' ' -f1)
              fi
            fi
          fi
          echo "live: ${LIVE_NAME:-<tidak ada>} ${LIVE_SHA:-}"

          # --- 3. Probe read-only (tanpa login, tanpa tulis DB/Blob) ---
          code_of() { curl -sS -o /dev/null -w '%{http_code}' "$1"; }
          expect_code() { # url yang-diharapkan label
            local got
            got=$(code_of "$1")
            if [ "${got}" = "$2" ]; then
              echo "OK   $3 -> ${got}"
            else
              echo "::error::$3 -> ${got} (diharapkan $2) di $1"
              FAIL=1
            fi
          }
          expect_login_redirect() { # path
            local out code loc
            out=$(curl -sS -o /dev/null -D - "${BASE_URL}$1")
            code=$(printf '%s' "${out}" | head -n1 | awk '{print $2}')
            loc=$(printf '%s' "${out}" | grep -i '^location:' | tr -d '\r' | awk '{print $2}')
            if [ "${code}" = "307" ] && printf '%s' "${loc}" | grep -q '/login'; then
              echo "OK   $1 -> 307 ${loc}"
            else
              echo "::error::$1 -> ${code:-?} ${loc:-?} (diharapkan 307 ke /login)"
              FAIL=1
            fi
          }
          # Jalur hardening cron (perbandingan constant-time) harus hidup:
          # secret salah dan tanpa secret sama-sama 401, bukan 200.
          expect_code "${BASE_URL}/api/cron?secret=salah" 401 "/api/cron (secret salah)"
          expect_code "${BASE_URL}/api/cron" 401 "/api/cron (tanpa secret)"
          for p in / /slip-gaji /hr /persetujuan /laporan /kalender /riwayat /notifikasi; do
            expect_login_redirect "$p"
          done

          # --- 4. Putusan sidik jari ---
          if [ "${EXPECTED_AVAILABLE}" = "true" ] && [ -n "${LIVE_SHA}" ]; then
            if [ "${EXPECTED_SHA}" = "${LIVE_SHA}" ]; then
              STATUS="MATCH: alias production menyajikan build ${TARGET_SHA}."
              echo "${STATUS}"
            else
              STATUS="MISMATCH: alias production menyajikan ${LIVE_NAME}, sedangkan build ${TARGET_SHA} adalah ${EXPECTED_NAME}."
              echo "::error::${STATUS} Artinya deploy commit ini BELUM live (alias nyangkut di deployment lama / ada Instant Rollback). Periksa dashboard Vercel lalu Promote to Production."
              if [ "${EVENT_NAME}" = "workflow_run" ] || [ "${FAIL_ON_MISMATCH}" = "true" ]; then
                FAIL=1
              else
                echo "::warning::fail_on_mismatch=false → mismatch tidak menggagalkan run."
              fi
            fi
          else
            STATUS="Sidik jari tidak bisa dibandingkan (artifact CI tidak tersedia); probe read-only tetap dijalankan."
          fi

          {
            echo "status=${STATUS}"
            echo "live_name=${LIVE_NAME}"
            echo "live_sha=${LIVE_SHA}"
            echo "probe_fail=${FAIL}"
          } >> "$GITHUB_OUTPUT"
          # Probe yang gagal tidak menghentikan langkah (supaya ringkasan selalu
          # ditulis); statusnya dibaca langkah berikutnya.
          exit 0

      - name: Ringkasan
        if: always()
        run: |
          {
            echo "## Post-deploy smoke — \`${BASE_URL}\`"
            echo ""
            echo "* commit diperiksa: \`${TARGET_SHA}\`"
            echo "* chunk live: \`${{ steps.smoke.outputs.live_name }}\` (sha256 \`${{ steps.smoke.outputs.live_sha }}\`)"
            if [ "${{ steps.smoke.outputs.expected_available }}" = "true" ]; then
              echo "* chunk build commit itu: \`${{ steps.smoke.outputs.expected_name }}\` (sha256 \`${{ steps.smoke.outputs.expected_sha }}\`)"
            else
              echo "* chunk build commit itu: tidak tersedia (artifact CI tidak ada)"
            fi
            echo "* hasil: ${{ steps.smoke.outputs.status }}"
            echo ""
            echo "Probe read-only yang dijalankan: \`/login\` 200, chunk-nya 200, \`/api/cron\`"
            echo "(secret salah & tanpa secret) 401, dan 8 rute terproteksi 307 → \`/login\`."
            echo "Smoke ini **tidak** login dan **tidak** menulis apa pun ke DB/Blob production."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Gagalkan run bila ada yang tidak sesuai
        if: steps.smoke.outputs.probe_fail != '0'
        run: |
          echo "::error::Post-deploy smoke menemukan ketidaksesuaian — lihat ringkasan di atas."
          exit 1
